version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: careerai-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: careerai-worker

    command: celery -A src.infrastructure.queue.celery_app.celery_app worker --loglevel=info

    depends_on:
      - redis
      - postgres

    env_file:
      - .env

    volumes:
      - .:/app
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: careerai-beat

    command: celery -A src.infrastructure.queue.celery_app.celery_app beat --loglevel=info

    depends_on:
      - redis
      - postgres

    env_file:
      - .env

    volumes:
      - .:/app

  postgres:
    image: pgvector/pgvector:pg16

    container_name: careerai-postgres

    environment:
      POSTGRES_DB: careerai
      POSTGRES_USER: careerai
      POSTGRES_PASSWORD: careerai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: careerai-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: